version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-scale-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 321738392
      POSTGRES_DB: smart_scale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./smart-scale-backend
      dockerfile: Dockerfile
    container_name: smart-scale-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 321738392
      DATABASE_DBNAME: smart_scale
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: smart-scale-rag-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:321738392@postgres:5432/smart_scale
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SERVER_PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: smart-scale-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./smart-scale-backend/frontend-react/dist:/usr/share/nginx/html:ro
      - ./smart-scale-backend/frontend:/usr/share/nginx/html-legacy:ro
    depends_on:
      - backend
      - rag-service

volumes:
  postgres_data:
