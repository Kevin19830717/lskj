<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能饮食健康秤</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            background: rgba(255,255,255,0.96);
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 36px; }
        .logo .icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .logo h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 6px; font-weight: 700; }
        .logo p { color: #888; font-size: 14px; }
        .tab-switch { display: flex; margin-bottom: 28px; background: #f0f0f5; border-radius: 12px; padding: 4px; }
        .tab-switch button {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s;
            background: transparent; color: #888;
        }
        .tab-switch button.active { background: white; color: #1a1a2e; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-panel { display: none; animation: fadeIn 0.3s ease; }
        .form-panel.active { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 13px; color: #555; margin-bottom: 6px;
            font-weight: 600; letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%; padding: 13px 16px; border: 2px solid #e8e8ee;
            border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none;
            background: #fafafa;
        }
        .form-group input:focus { border-color: #667eea; background: white; box-shadow: 0 0 0 4px rgba(102,126,234,0.08); }
        .form-group input::placeholder { color: #c0c0c8; }
        .input-icon { position: relative; }
        .input-icon .icon-left {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 16px; color: #aaa; z-index: 1;
        }
        .input-icon input { padding-left: 44px; }
        .btn-submit {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 12px; font-size: 16px;
            cursor: pointer; font-weight: 700; letter-spacing: 0.5px;
            transition: all 0.3s; margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.45);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-submit .spinner {
            display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-submit.loading .spinner { display: inline-block; }
        .btn-submit.loading .btn-text { display: none; }
        .error-msg {
            background: #fff0f0; color: #d32f2f; padding: 12px 16px; border-radius: 10px;
            margin-bottom: 16px; font-size: 13px; display: none; border: 1px solid #ffcdd2;
            animation: shake 0.4s ease;
        }
        .success-msg {
            background: #e8f5e9; color: #2e7d32; padding: 12px 16px; border-radius: 10px;
            margin-bottom: 16px; font-size: 13px; display: none; border: 1px solid #c8e6c9;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
        .form-hint {
            font-size: 12px; color: #999; margin-top: 4px; text-align: right;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <span class="icon">⚖️</span>
            <h1>智能饮食健康秤</h1>
            <p>AI 驱动的个性化营养管理平台</p>
        </div>
        <div class="tab-switch">
            <button id="tabLogin" class="active" onclick="switchTab('login')">登 录</button>
            <button id="tabRegister" onclick="switchTab('register')">注 册</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <!-- 登录表单 -->
        <form id="loginForm" class="form-panel active" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>手机号</label>
                <div class="input-icon">
                    <span class="icon-left">📱</span>
                    <input type="tel" id="loginPhone" placeholder="请输入11位手机号" required maxlength="11">
                </div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <div class="input-icon">
                    <span class="icon-left">🔒</span>
                    <input type="password" id="loginPassword" placeholder="请输入密码" required minlength="6" autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn-submit" id="loginBtn">
                <span class="spinner"></span><span class="btn-text">登 录</span>
            </button>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" class="form-panel" onsubmit="return handleRegister(event)">
            <div class="form-group">
                <label>昵称</label>
                <div class="input-icon">
                    <span class="icon-left">👤</span>
                    <input type="text" id="regNickname" placeholder="给自己起个名字吧" required minlength="1" maxlength="20">
                </div>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <div class="input-icon">
                    <span class="icon-left">📱</span>
                    <input type="tel" id="regPhone" placeholder="请输入11位手机号" required maxlength="11" pattern="[0-9]{11}">
                </div>
            </div>
            <div class="form-group">
                <label>设置密码</label>
                <div class="input-icon">
                    <span class="icon-left">🔑</span>
                    <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6" maxlength="64" autocomplete="new-password">
                </div>
                <div class="form-hint" id="pwdStrength"></div>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <div class="input-icon">
                    <span class="icon-left">✅</span>
                    <input type="password" id="regPassword2" placeholder="再次输入密码" required minlength="6" maxlength="64" autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="btn-submit" id="registerBtn">
                <span class="spinner"></span><span class="btn-text">立即注册</span>
            </button>
            <p style="text-align:center;margin-top:16px;font-size:13px;color:#888">
                已有账号？<a href="#" onclick="switchTab('login')" style="color:#667eea;text-decoration:none;font-weight:600;">立即登录</a>
            </p>
        </form>
    </div>

<script>
const API = '/api/v1';
let currentTab = 'login';

function switchTab(tab) {
    currentTab = tab;
    hideMessages();
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').reset();
    document.getElementById('registerForm').reset();
    document.getElementById('pwdStrength').textContent = '';
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    const suc = document.getElementById('successMsg');
    suc.style.display = 'none';
    el.textContent = msg;
    el.style.display = 'block';
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'shake 0.4s ease';
}

function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    el.textContent = msg;
    el.style.display = 'block';
}

function hideMessages() {
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
}

function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
        btn.classList.add('loading');
        btn.disabled = true;
    } else {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}

// 登录
async function handleLogin(e) {
    e.preventDefault();
    hideMessages();
    const phone = document.getElementById('loginPhone').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!phone || !password) { showError('请填写手机号和密码'); return false; }
    if (phone.length !== 11 || !/^\d{11}$/.test(phone)) { showError('请输入正确的11位手机号'); return false; }

    setLoading('loginBtn', true);
    try {
        const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.code === 0 && data.data) {
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            showSuccess('登录成功，正在跳转...');
            setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
        } else {
            showError(data.message || '登录失败，请检查手机号和密码');
        }
    } catch (err) {
        showError('网络连接失败，请检查网络后重试');
    } finally {
        setLoading('loginBtn', false);
    }
    return false;
}

// 注册
async function handleRegister(e) {
    e.preventDefault();
    hideMessages();
    const nickname = document.getElementById('regNickname').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;

    if (!nickname || !phone || !password || !password2) {
        showError('请填写所有字段');
        return false;
    }
    if (phone.length !== 11 || !/^\d{11}$/.test(phone)) {
        showError('请输入正确的11位手机号');
        return false;
    }
    if (password.length < 6) {
        showError('密码长度至少6位');
        return false;
    }
    if (password !== password2) {
        showError('两次输入的密码不一致');
        return false;
    }

    setLoading('registerBtn', true);
    try {
        const res = await fetch(`${API}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password, nickname })
        });
        const data = await res.json();

        if (data.code === 0) {
            showSuccess('注册成功！正在登录...');
            // 自动登录
            const loginRes = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });
            const loginData = await loginRes.json();
            if (loginData.code === 0 && loginData.data) {
                localStorage.setItem('token', loginData.data.token);
                localStorage.setItem('user', JSON.stringify(loginData.data.user));
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 600);
            } else {
                switchTab('login');
                showSuccess('注册成功！请登录');
            }
        } else {
            showError(data.message || '注册失败，请重试');
        }
    } catch (err) {
        showError('网络连接失败，请检查网络后重试');
    } finally {
        setLoading('registerBtn', false);
    }
    return false;
}

// 密码强度提示
document.getElementById('regPassword').addEventListener('input', function() {
    const v = this.value;
    const el = document.getElementById('pwdStrength');
    if (v.length === 0) { el.textContent = ''; return; }
    if (v.length < 6) { el.textContent = '⚠️ 太短了'; el.style.color = '#e53935'; }
    else if (v.length < 8) { el.textContent = '🔸 一般'; el.style.color = '#f57c00'; }
    else if (/[A-Z]/.test(v) && /[0-9]/.test(v)) { el.textContent = '🔒 强'; el.style.color = '#2e7d32'; }
    else { el.textContent = '🔸 中等'; el.style.color = '#f57c00'; }
});
</script>
</body>
</html>
