<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能饮食健康秤 - 个人中心</title>
    <link rel="stylesheet" href="css/style-v15.css">
    <style>
        /* 个人资料顶部卡片 */
        .profile-header-card {
            background:
                linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 18px; padding: 28px 30px;
            margin-bottom: 24px;
            color: white; position: relative; overflow: hidden;
            box-shadow: 0 8px 28px rgba(102,126,234,0.3);
        }
        .profile-header-card::before {
            content:''; position:absolute; top:-40px; right:-20px; width:160px; height:160px;
            background:radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); border-radius:50%;
        }
        .phc-inner { display: flex; align-items: center; gap: 22px; position: relative; z-index: 1; }
        .phc-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 2px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 700; color: white; flex-shrink: 0;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(102,126,234,0.4);
        }
        .phc-avatar:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(102,126,234,0.5); }
        .phc-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .phc-avatar .upload-overlay {
            position:absolute; inset:0; background:rgba(0,0,0,0.35);
            display:flex;align-items:center;justify-content:center;font-size:11px;opacity:0;
            transition:opacity 0.2s; border-radius:50%;
        }
        .phc-avatar:hover .upload-overlay{ opacity:1; }
        .phc-info { flex: 1; min-width: 0; }
        .phc-row {
            display:flex; align-items:center; gap:8px; margin-bottom:10px;
        }
        .phc-label {
            font-size:12px; opacity:0.7; letter-spacing:0.5px;
            min-width:48px; flex-shrink:0;
        }
        .phc-input {
            background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28);
            border-radius: 9px; padding: 7px 12px; font-size: 14px; font-weight:600;
            color: white; outline: none;
            transition: all 0.25s ease;
            max-width: 180px;
        }
        .phc-input::placeholder { color: rgba(255,255,255,0.45); }
        .phc-input:focus {
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.22);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
        }
        .phc-phone { font-size:14px; opacity:0.85; letter-spacing:1px; font-weight:500; }
        .phc-actions { margin-top: 4px; }
    </style>
</head>
<body data-theme="profile">
    <nav class="sidebar">
        <div class="sidebar-header"><span class="logo-icon">🥗</span><h2>智能饮食秤</h2></div>
        <ul class="nav-menu">
            <li><a href="dashboard.html"><span>📊</span> 仪表盘</a></li>
            <li><a href="records.html"><span>📝</span> 历史记录</a></li>
            <li><a href="reports.html"><span>📋</span> 营养报告</a></li>
            <li><a href="foods.html"><span>🍽️</span> 食物库</a></li>
            <li class="active"><a href="profile.html" id="profilePageLink"><span>👤</span> 个人中心</a></li>
        </ul>
        <div class="sidebar-user-area" id="sidebarUserArea">
            <div class="sidebar-user-row">
                <div class="user-avatar-circle" id="userAvatarCircle" onclick="window.location.href='profile.html'">
                    <span id="avatarLetter">?</span>
                    <img id="avatarImg" style="display:none;" alt=""></div>
                <div class="sidebar-logout-area">
                    <a href="javascript:void(0)" onclick="logout()" class="logout-btn-pill">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="main-panel">
        <header class="top-bar"><h3>👤 个人中心</h3></header>

        <!-- 个人资料顶部卡片 -->
        <div class="profile-header-card">
            <div class="phc-inner">
                <div class="phc-avatar" id="phcAvatar" onclick="document.getElementById('phcAvatarFile').click()">
                    <span id="phcAvatarLetter">?</span>
                    <img id="phcAvatarImg" style="display:none;" alt="">
                    <span class="upload-overlay">更换头像</span>
                    <input type="file" id="phcAvatarFile" accept="image/*" style="display:none;" onchange="uploadProfileAvatar(event)">
                </div>
                <div class="phc-info">
                    <div class="phc-row">
                        <span class="phc-label">昵称</span>
                        <input type="text" id="phcNickname" class="phc-input" placeholder="设置昵称..." maxlength="20">
                    </div>
                    <div class="phc-row">
                        <span class="phc-label">手机号</span>
                        <input type="tel" id="phcPhone" class="phc-input" placeholder="手机号..." maxlength="11">
                    </div>
                    <div class="phc-actions">
                        <button onclick="saveBasicInfo()" class="btn btn-sm btn-outline">保存基本信息</button>
                    </div>
                </div>
            </div>
        </div>

        <section class="profile-section">
            <form id="profileForm" onsubmit="saveProfile(event)" class="card">
                <h4>基本信息</h4>
                <div class="form-grid">
                    <div class="field">
                        <label>性别</label>
                        <select id="gender">
                            <option value="">未设置</option>
                            <option value="male">男</option>
                            <option value="female">女</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="field"><label>年龄</label><input type="number" id="age" min="1" max="150" placeholder="年龄"></div>
                    <div class="field"><label>身高 (cm)</label><input type="number" id="heightCm" step="0.01" min="50" max="300" placeholder="身高"></div>
                    <div class="field"><label>体重 (kg)</label><input type="number" id="weightKg" step="0.1" min="10" max="500" placeholder="体重"></div>
                    <div class="field">
                        <label>健康目标</label>
                        <select id="healthGoal">
                            <option value="">未设置</option>
                            <option value="lose_weight">减脂</option>
                            <option value="gain_weight">增重</option>
                            <option value="maintain">保持体重</option>
                            <option value="muscle_gain">增肌</option>
                            <option value="health_maintenance">健康维护</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>过敏食物（逗号分隔）</label>
                        <input type="text" id="allergies" placeholder="如: 花生,海鲜">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">保存修改</button>
            </form>

            <div class="card mt-4" id="medicalCard">
                <h4>🩺 体检报告智能识别</h4>
                <p style="color:#666;font-size:13px;margin-bottom:16px;">上传体检报告照片，AI 自动识别关键指标</p>

                <!-- 上传区域 -->
                <div id="uploadZone" class="upload-zone" onclick="document.getElementById('reportFile').click()">
                    <div class="upload-icon">📷</div>
                    <p>点击或拖拽上传体检报告图片</p>
                    <small style="color:#999;">支持 JPG、PNG 格式</small>
                </div>
                <input type="file" id="reportFile" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

                <!-- 图片预览 -->
                <div id="imagePreview" class="image-preview hidden">
                    <img id="previewImg" src="" alt="预览">
                    <button onclick="clearImage()" class="btn btn-sm btn-secondary" style="margin-top:8px;">重新选择</button>
                </div>

                <!-- AI 解析按钮 -->
                <div id="parseActions" class="hidden" style="margin-top:16px;">
                    <button onclick="parseReport()" id="parseBtn" class="btn btn-primary">
                        <span>🤖 AI 智能解析</span>
                    </button>
                </div>

                <!-- 解析结果表单 -->
                <div id="parsedResult" class="hidden" style="margin-top:20px;">
                    <h5 style="margin-bottom:12px;color:#333;">📋 识别结果（可编辑）</h5>
                    <div id="parsedFields" class="form-grid"></div>
                    <button onclick="saveParsedReport()" class="btn btn-primary" style="margin-top:16px;">💾 保存报告</button>
                </div>

                <!-- 历史报告列表 -->
                <div id="reportHistory" style="margin-top:24px;">
                    <h5 style="margin-bottom:12px;color:#333;">📁 历史报告</h5>
                    <div id="reportList"><p class="empty-text">暂无报告</p></div>
                </div>
            </div>

            <style>
                .upload-zone {
                    border: 2px dashed #c5cae9; border-radius: 12px; padding: 40px 20px;
                    text-align: center; cursor: pointer; transition: all 0.3s ease;
                    background: #f8f9ff;
                }
                .upload-zone:hover { border-color: #667eea; background: #eeedff; }
                .upload-zone.dragover { border-color: #667eea; background: #e8e7ff; }
                .upload-icon { font-size: 48px; margin-bottom: 8px; }
                .image-preview { text-align: center; margin-top: 12px; }
                .image-preview img { max-width: 100%; max-height: 300px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
                .parsed-field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
                .parsed-field label { font-size: 13px; color: #666; min-width: 100px; font-weight: 500; }
                .parsed-field input { flex: 1; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
                .parsed-field input:focus { border-color: #667eea; outline: none; }
                .report-history-item {
                    background: #f8f9fa; border-radius: 8px; padding: 12px 16px;
                    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
                }
                .report-history-item small { color: #999; }
            </style>

            <div class="card mt-4 stats-mini">
                <h4>我的统计</h4>
                <div id="userStats" class="mini-stats-grid"></div>
            </div>
        </section>
        </div><!-- end main-panel -->
    </main>

    <script src="js/app.js?v=13"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadProfile();
            loadUserStats();
            loadReportHistory();
            loadProfileHeader();
        });

        // ========== 顶部个人资料卡 ==========
        function loadProfileHeader() {
            // 先从 localStorage 读缓存（快速填充）
            let user = null;
            try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) {}

            const nameEl = document.getElementById('phcNickname');
            const letterEl = document.getElementById('phcAvatarLetter');
            const phoneEl = document.getElementById('phcPhone');
            const avatarImg = document.getElementById('phcAvatarImg');

            if (nameEl) nameEl.value = user.nickname || '';
            if (phoneEl) phoneEl.value = user.phone || '';

            const displayName = (user.nickname || user.phone || '').trim();
            if (letterEl && displayName) { 
                letterEl.textContent = displayName.charAt(0).toUpperCase();
                // 同步侧边栏字母
                const sideLetter = document.getElementById('avatarLetter');
                if (sideLetter) sideLetter.textContent = letterEl.textContent;
            }

            // 检查本地头像
            if (avatarImg) {
                const saved = localStorage.getItem('user_avatar');
                if (saved) { avatarImg.src = saved; avatarImg.style.display='block'; if(letterEl)letterEl.style.display='none'; }
            }

            // 从数据库拉最新 profile 覆盖
            apiGet('/user/profile').then(res => {
                if (!res.data) return;
                const p = res.data;
                if (p.nickname && nameEl) nameEl.value = p.nickname;
                if (p.phone && phoneEl) phoneEl.value = p.phone;
                // 更新首字母
                const dn = (p.nickname || p.phone || '').trim();
                if (letterEl && dn) { 
                    letterEl.textContent = dn.charAt(0).toUpperCase();
                    // 同步侧边栏字母
                    const sideLetter = document.getElementById('avatarLetter');
                    if (sideLetter) sideLetter.textContent = letterEl.textContent;
                }
                // 同步缓存
                try { 
                    let u = JSON.parse(localStorage.getItem('user')||'{}'); 
                    u.nickname = p.nickname || u.nickname; 
                    u.phone = p.phone || u.phone; 
                    localStorage.setItem('user', JSON.stringify(u)); 
                } catch(e){}
                if (!localStorage.getItem('user_avatar')) {
                    avatarImg.style.display='none';
                    letterEl.style.display='';
                }
            }).catch(() => {});
        }

        function uploadProfileAvatar(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showToast('请选图片','error'); return; }
            if (file.size > 5*1024*1024) { showToast('图片不超过5MB','error'); return; }

            const reader = new FileReader();
            reader.onload = ev => {
                const url = ev.target.result;
                localStorage.setItem('user_avatar', url);
                const img = document.getElementById('phcAvatarImg');
                const letter = document.getElementById('phcAvatarLetter');
                const sideImg = document.getElementById('avatarImg');
                const sideLetter = document.getElementById('avatarLetter');

                if (img) { img.src=url; img.style.display='block'; }
                if (letter) letter.style.display='none';
                if (sideImg) { sideImg.src=url; sideImg.style.display='block'; }
                if (sideLetter) sideLetter.style.display='none';

                showToast('头像已更新','success');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function saveBasicInfo() {
            const nickname = document.getElementById('phcNickname').value.trim();
            const phone = document.getElementById('phcPhone').value.trim();
            apiPut('/user/profile', { nickname, phone }).then(() => {
                showToast('基本信息已保存','success');
                let u = {};
                try { u = JSON.parse(localStorage.getItem('user')||'{}'); } catch(e){}
                if (nickname) u.nickname = nickname;
                if (phone) u.phone = phone;
                localStorage.setItem('user', JSON.stringify(u));
                // 同步两个头像字母
                const letter = nickname ? nickname.charAt(0).toUpperCase() : '';
                const phcLetterEl = document.getElementById('phcAvatarLetter');
                const sideLetterEl = document.getElementById('avatarLetter');
                if (phcLetterEl && letter) phcLetterEl.textContent = letter;
                if (sideLetterEl && letter) sideLetterEl.textContent = letter;
            }).catch(e => showToast('保存失败: '+e.message, 'error'));
        }

        function loadProfile() {
            apiGet('/user/profile').then(res => {
                if (!res.data) return;
                const p = res.data;
                if (p.gender) document.getElementById('gender').value = p.gender;
                if (p.age) document.getElementById('age').value = p.age;
                if (p.height_cm) document.getElementById('heightCm').value = p.height_cm;
                if (p.weight_kg) document.getElementById('weightKg').value = p.weight_kg;
                if (p.health_goal) document.getElementById('healthGoal').value = p.health_goal;
                if (p.allergies && Array.isArray(p.allergies)) {
                    document.getElementById('allergies').value = p.allergies.join(', ');
                }
            }).catch(() => {});
        }

        function saveProfile(e) {
            e.preventDefault();
            const allergiesStr = document.getElementById('allergies').value;
            const body = {};
            const v = (id) => { const el=document.getElementById(id); return el.value||undefined; };
            if (v('gender')) body.gender=v('gender');
            if (document.getElementById('age').value) body.age=parseInt(document.getElementById('age').value);
            if (document.getElementById('heightCm').value) body.height_cm=parseFloat(document.getElementById('heightCm').value);
            if (document.getElementById('weightKg').value) body.weight_kg=parseFloat(document.getElementById('weightKg').value);
            if (v('healthGoal')) body.health_goal=v('healthGoal');
            if (allergiesStr) body.allergies=allergiesStr.split(',').map(s=>s.trim()).filter(Boolean);

            apiPut('/user/profile', body).then(() => alert('保存成功!')).catch(e=>alert('保存失败: '+e.message));
        }

        // ========== 体检报告图片上传 & AI 解析 ==========
        let currentReportFile = null;
        let currentParsedData = {};

        // 拖拽上传
        const uploadZone = document.getElementById('uploadZone');
        if (uploadZone) {
            uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
            uploadZone.addEventListener('drop', e => {
                e.preventDefault(); uploadZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length) handleFile(files[0]);
            });
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) handleFile(file);
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showToast('请上传图片文件', 'error'); return;
            }
            currentReportFile = file;
            const reader = new FileReader();
            reader.onload = ev => {
                document.getElementById('previewImg').src = ev.target.result;
                document.getElementById('imagePreview').classList.remove('hidden');
                document.getElementById('uploadZone').classList.add('hidden');
                document.getElementById('parseActions').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            currentReportFile = null;
            document.getElementById('previewImg').src = '';
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadZone').classList.remove('hidden');
            document.getElementById('parseActions').classList.add('hidden');
            document.getElementById('parsedResult').classList.add('hidden');
            document.getElementById('reportFile').value = '';
        }

        async function parseReport() {
            if (!currentReportFile) { showToast('请先上传图片', 'error'); return; }
            const btn = document.getElementById('parseBtn');
            btn.disabled = true; btn.innerHTML = '<span>⏳ AI 解析中...</span>';

            const formData = new FormData();
            formData.append('file', currentReportFile);

            try {
                const resp = await fetch('/rag/api/v1/rag/parse-medical-report', {
                    method: 'POST', body: formData
                });
                const data = await resp.json();
                if (data.code === 0 && data.data) {
                    renderParsedFields(data.data.parsed_data || data.data.raw_response);
                    document.getElementById('parsedResult').classList.remove('hidden');
                    showToast('AI 解析完成', 'success');
                } else {
                    showToast(data.message || '解析失败', 'error');
                }
            } catch(e) {
                showToast('请求失败: ' + e.message, 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = '<span>🤖 AI 智能解析</span>';
            }
        }

        function renderParsedFields(rawData) {
            const container = document.getElementById('parsedFields');
            container.innerHTML = '';
            currentParsedData = {};

            let fields = {};
            // 尝试解析 JSON 格式
            if (typeof rawData === 'string') {
                try {
                    const parsed = JSON.parse(rawData.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim());
                    if (parsed && typeof parsed === 'object') fields = parsed;
                } catch(e) {
                    // 不是 JSON，按行分割
                    rawData.split('\n').forEach(line => {
                        const m = line.match(/^(.+?)[:：]\s*(.+)$/);
                        if (m) fields[m[1].trim()] = m[2].trim();
                    });
                }
            } else if (typeof rawData === 'object') {
                fields = rawData;
            }

            if (!Object.keys(fields).length) {
                container.innerHTML = '<p class="empty-text">未能识别出结构化数据，请手动输入</p>';
                return;
            }

            currentParsedData = fields;
            Object.entries(fields).forEach(([key, val]) => {
                const div = document.createElement('div');
                div.className = 'field';
                div.innerHTML = `<label>${key}</label><input type="text" data-key="${key}" value="${val}">`;
                container.appendChild(div);
            });
        }

        function saveParsedReport() {
            const inputs = document.querySelectorAll('#parsedFields input');
            const reportData = {};
            inputs.forEach(inp => { reportData[inp.dataset.key] = inp.value; });

            apiPost('/user/medical-report', { report_data: reportData })
                .then(() => {
                    showToast('报告保存成功', 'success');
                    clearImage();
                    loadReportHistory();
                })
                .catch(e => showToast('保存失败: ' + e.message, 'error'));
        }

        function loadReportHistory() {
            apiGet('/user/profile').then(res => {
                if (!res.data || !res.data.medical_reports) return;
                const reports = res.data.medical_reports;
                const list = document.getElementById('reportList');
                const keys = Object.keys(reports);
                if (!keys.length) { list.innerHTML = '<p class="empty-text">暂无报告</p>'; return; }
                list.innerHTML = keys.map(k => {
                    const r = reports[k];
                    const date = r.report_date || '-';
                    const dataKeys = Object.keys(r.report_data || {});
                    return `<div class="report-history-item">
                        <div><strong>${k}</strong> <small>${date}</small><br><small>${dataKeys.slice(0,3).join(', ')}${dataKeys.length>3?'...':''}</small></div>
                    </div>`;
                }).join('');
            }).catch(() => {});
        }

        function loadUserStats() {
            apiGet('/user/stats').then(res => {
                if (!res.data) return;
                document.getElementById('userStats').innerHTML =
                    Object.entries(res.data).map(([k,v]) =>
                        `<div class="mini-stat"><span class="label">${k}</span><span class="val">${v}</span></div>`
                    ).join('');
            });
        }
    </script>
</body>
</html>
