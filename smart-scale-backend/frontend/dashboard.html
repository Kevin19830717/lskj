<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 智能饮食健康秤</title>
    <link rel="stylesheet" href="/css/style-v15.css?v=17">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* Dashboard-specific styles */
        #calorieChart { max-height: 300px; }
    </style>
</head>
<body data-theme="dashboard">
    <nav class="sidebar">
        <div class="sidebar-header"><span class="logo-icon">🥗</span><h2>智能饮食秤</h2></div>
        <ul class="nav-menu">
            <li class="active"><a href="/dashboard"><span>📊</span> 仪表盘</a></li>
            <li><a href="/records"><span>📝</span> 历史记录</a></li>
            <li><a href="/reports"><span>📋</span> 营养报告</a></li>
            <li><a href="/foods"><span>🍽️</span> 食物库</a></li>
            <li><a href="/profile" id="profilePageLink"><span>👤</span> 个人中心</a></li>
        </ul>
        <div class="sidebar-user-area" id="sidebarUserArea">
            <div class="sidebar-user-row">
                <div class="user-avatar-circle" id="userAvatarCircle" onclick="window.location.href='/profile'">
                    <span id="avatarLetter">?</span></div>
                <div class="sidebar-logout-area">
                    <a href="javascript:void(0)" onclick="logout()" class="logout-btn-pill">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="main-panel">
            <header class="top-bar"><h3>📊 仪表盘</h3></header>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsCards">
            <div class="stat-card stat-energy">
                <div><span class="stat-icon">🔥</span></div>
                <div><span class="stat-label">本周平均热量</span><span class="stat-value" id="statCal">--</span></div>
            </div>
            <div class="stat-card stat-protein">
                <div><span class="stat-icon">💪</span></div>
                <div><span class="stat-label">本周平均蛋白质</span><span class="stat-value" id="statPro">--</span></div>
            </div>
            <div class="stat-card stat-fat">
                <div><span class="stat-icon">🧈</span></div>
                <div><span class="stat-label">本周平均脂肪</span><span class="stat-value" id="statFat">--</span></div>
            </div>
            <div class="stat-card stat-carb">
                <div><span class="stat-icon">🍚</span></div>
                <div><span class="stat-label">本周平均碳水</span><span class="stat-value" id="statCarb">--</span></div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="charts-row">
            <div class="chart-card" style="flex:1;">
                <h4>📈 近7天热量趋势</h4>
                <canvas id="calorieChart"></canvas>
            </div>
        </div>
        </div><!-- end main-panel -->
    </main>

    <script src="/js/app.js?v=13"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadStats();
            loadChart();
        });

        async function loadStats() {
            try {
                const d = await apiGet('/dashboard/stats');
                if (d.code === 0 && d.data) {
                    const s = d.data;
                    document.getElementById('statCal').textContent = (s.avg_daily_energy_kcal?.toFixed(0) || '--') + ' kcal';
                    document.getElementById('statPro').textContent = (s.total_protein_g?.toFixed(1) || '--') + ' g';
                    document.getElementById('statFat').textContent = (s.total_fat_g?.toFixed(1) || '--') + ' g';
                    document.getElementById('statCarb').textContent = (s.total_carbohydrate_g?.toFixed(1) || '--') + ' g';
                }
            } catch(e) { console.error('Load stats error:', e); }
        }

        async function loadChart() {
            try {
                const d = await apiGet('/dashboard/recent-meals');
                if (d.code !== 0 || !d.data?.length) return;
                const meals = d.data.slice(-7);
                const labels = meals.map(m => m.created_at?.split('T')[0] || '');
                const calories = meals.map(m => m.cooked_energy_kcal || 0);

                new Chart(document.getElementById('calorieChart'), {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: '热量 (kcal)',
                            data: calories,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102,126,234,0.1)',
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: '#f0f0f0' } } }
                    }
                });
            } catch(e) { console.error('Load chart error:', e); }
        }


    </script>
</body>
</html>
