events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 前端静态文件
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 兼容旧版 HTML 入口，统一跳转到 React 路由
        location = /dashboard.html {
            return 301 /dashboard;
        }
        location ~ ^/(records|reports|foods|profile)\.html$ {
            return 301 /$1;
        }
        location /css/ {
            root /usr/share/nginx/html-legacy;
            try_files $uri =404;
        }
        location /js/ {
            root /usr/share/nginx/html-legacy;
            try_files $uri =404;
        }
        location /images/ {
            root /usr/share/nginx/html-legacy;
            try_files $uri =404;
        }

        # 前端路由 fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理 - Go后端
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
            proxy_read_timeout 60s;
        }

        # RAG API 反向代理
        location /rag/ {
            rewrite ^/rag/(.*) /$1 break;
            proxy_pass http://rag-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # 静态资源缓存（图片/字体可以长缓存）
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # JS/CSS 开发模式不缓存（含?v=参数已做版本控制）
        location ~* \.(css|js)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
